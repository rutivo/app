<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestor Transfer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Gestor Transfer</h1>
    <nav role="tablist">
      <button role="tab" data-tab="transfers" aria-selected="true">Traslados</button>
      <button role="tab" data-tab="drivers">Conductores</button>
      <button role="tab" data-tab="vehicles">Vehículos</button>
    </nav>
  </header>

  <main>
    <div id="toast" role="status" aria-live="polite" hidden></div>

    <section id="transfers" class="panel">
      <form id="transfer-form" class="card grid">
        <h2>Nuevo traslado</h2>
        <label>Cliente <input name="customerName" required maxlength="120" /></label>
        <label>Teléfono <input name="customerPhone" required maxlength="40" /></label>
        <label>Email <input name="customerEmail" type="email" /></label>
        <label>Recogida <input name="pickupLocation" required maxlength="200" /></label>
        <label>Destino <input name="dropoffLocation" required maxlength="200" /></label>
        <label>Fecha y hora <input name="pickupAt" type="datetime-local" required /></label>
        <label>Duración (min) <input name="durationMinutes" type="number" min="1" value="60" required /></label>
        <label>Pasajeros <input name="passengers" type="number" min="1" value="1" required /></label>
        <label>Precio (€) <input name="price" type="number" min="0" step="0.01" value="0" required /></label>
        <label class="wide">Notas <textarea name="notes" maxlength="1000" rows="2"></textarea></label>
        <button type="submit" class="primary">Crear traslado</button>
      </form>

      <div class="card">
        <div class="toolbar">
          <h2>Traslados</h2>
          <label>Estado
            <select id="status-filter">
              <option value="">Todos</option>
              <option value="pending">Pendiente</option>
              <option value="assigned">Asignado</option>
              <option value="in_progress">En curso</option>
              <option value="completed">Completado</option>
              <option value="cancelled">Cancelado</option>
            </select>
          </label>
          <label>Día <input id="date-filter" type="date" /></label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Ruta</th><th>Pax</th><th>Precio</th><th>Estado</th><th>Asignación</th><th>Acciones</th></tr></thead>
            <tbody id="transfer-rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="drivers" class="panel" hidden>
      <form id="driver-form" class="card grid">
        <h2>Nuevo conductor</h2>
        <label>Nombre <input name="name" required maxlength="120" /></label>
        <label>Teléfono <input name="phone" required maxlength="40" /></label>
        <label>Licencia <input name="license" required maxlength="40" /></label>
        <button type="submit" class="primary">Añadir conductor</button>
      </form>
      <div class="card table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Teléfono</th><th>Licencia</th><th>Activo</th><th>Acciones</th></tr></thead>
          <tbody id="driver-rows"></tbody>
        </table>
      </div>
    </section>

    <section id="vehicles" class="panel" hidden>
      <form id="vehicle-form" class="card grid">
        <h2>Nuevo vehículo</h2>
        <label>Matrícula <input name="plate" required maxlength="20" /></label>
        <label>Modelo <input name="model" required maxlength="120" /></label>
        <label>Plazas <input name="seats" type="number" min="1" max="80" value="4" required /></label>
        <button type="submit" class="primary">Añadir vehículo</button>
      </form>
      <div class="card table-wrap">
        <table>
          <thead><tr><th>Matrícula</th><th>Modelo</th><th>Plazas</th><th>Activo</th><th>Acciones</th></tr></thead>
          <tbody id="vehicle-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="assign-dialog">
    <form method="dialog" id="assign-form">
      <h2>Asignar traslado <span id="assign-id"></span></h2>
      <label>Conductor <select name="driverId" required></select></label>
      <label>Vehículo <select name="vehicleId" required></select></label>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancelar</button>
        <button value="confirm" class="primary">Asignar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
